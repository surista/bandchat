<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Purple guitar">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6b21a8"/>
    </linearGradient>
    <linearGradient id="neckGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5d3a1f"/>
      <stop offset="100%" stop-color="#3d2410"/>
    </linearGradient>
  </defs>

  <g transform="rotate(-30 64 64)">
    <!-- Body (single-cutaway, Strat-ish) -->
    <path d="M 60 76
             C 44 74, 30 80, 24 94
             C 18 108, 24 122, 40 124
             C 54 126, 68 122, 76 110
             C 84 98, 82 86, 74 80
             C 70 76, 66 76, 60 76 Z"
          fill="url(#bodyGrad)" stroke="#3b0764" stroke-width="1.6"/>

    <!-- Body highlight sheen -->
    <path d="M 32 90 Q 26 100, 30 110 Q 34 112, 38 104 Q 36 94, 32 90 Z"
          fill="#c084fc" opacity="0.55"/>

    <!-- Pickups -->
    <rect x="44" y="92" width="22" height="4.5" rx="0.8" fill="#1a0b2e"/>
    <rect x="44" y="101" width="22" height="4.5" rx="0.8" fill="#1a0b2e"/>

    <!-- Bridge -->
    <rect x="50" y="111" width="16" height="3.5" rx="0.6" fill="#cbd5e1" stroke="#1a0b2e" stroke-width="0.4"/>

    <!-- Volume + tone knobs -->
    <circle cx="70" cy="106" r="2.6" fill="#cbd5e1" stroke="#1a0b2e" stroke-width="0.5"/>
    <circle cx="68" cy="114" r="2.6" fill="#cbd5e1" stroke="#1a0b2e" stroke-width="0.5"/>

    <!-- Neck -->
    <rect x="57" y="30" width="10" height="50" fill="url(#neckGrad)" stroke="#2d1810" stroke-width="0.9"/>

    <!-- Frets -->
    <line x1="57" y1="38" x2="67" y2="38" stroke="#cbd5e1" stroke-width="0.6"/>
    <line x1="57" y1="46" x2="67" y2="46" stroke="#cbd5e1" stroke-width="0.6"/>
    <line x1="57" y1="54" x2="67" y2="54" stroke="#cbd5e1" stroke-width="0.6"/>
    <line x1="57" y1="62" x2="67" y2="62" stroke="#cbd5e1" stroke-width="0.6"/>
    <line x1="57" y1="70" x2="67" y2="70" stroke="#cbd5e1" stroke-width="0.6"/>

    <!-- Fret dots -->
    <circle cx="62" cy="42" r="0.9" fill="#fef3c7"/>
    <circle cx="62" cy="50" r="0.9" fill="#fef3c7"/>
    <circle cx="62" cy="58" r="0.9" fill="#fef3c7"/>
    <circle cx="62" cy="66" r="0.9" fill="#fef3c7"/>

    <!-- Headstock -->
    <path d="M 54 12 L 70 12 L 68 30 L 56 30 Z"
          fill="#3b0764" stroke="#1a0b2e" stroke-width="0.9"/>

    <!-- Nut -->
    <rect x="56" y="29.5" width="12" height="1.2" fill="#fef3c7"/>

    <!-- Tuning pegs -->
    <circle cx="52" cy="16" r="1.8" fill="#cbd5e1" stroke="#1a0b2e" stroke-width="0.3"/>
    <circle cx="52" cy="22" r="1.8" fill="#cbd5e1" stroke="#1a0b2e" stroke-width="0.3"/>
    <circle cx="52" cy="28" r="1.8" fill="#cbd5e1" stroke="#1a0b2e" stroke-width="0.3"/>
    <circle cx="72" cy="16" r="1.8" fill="#cbd5e1" stroke="#1a0b2e" stroke-width="0.3"/>
    <circle cx="72" cy="22" r="1.8" fill="#cbd5e1" stroke="#1a0b2e" stroke-width="0.3"/>
    <circle cx="72" cy="28" r="1.8" fill="#cbd5e1" stroke="#1a0b2e" stroke-width="0.3"/>

    <!-- Strings (headstock → bridge) -->
    <line x1="58" y1="30" x2="51" y2="113" stroke="#f1f5f9" stroke-width="0.35"/>
    <line x1="60" y1="30" x2="56" y2="113" stroke="#f1f5f9" stroke-width="0.35"/>
    <line x1="62" y1="30" x2="60" y2="113" stroke="#f1f5f9" stroke-width="0.35"/>
    <line x1="64" y1="30" x2="64" y2="113" stroke="#f1f5f9" stroke-width="0.35"/>
  </g>
</svg>
