<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background rounded square -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A154B"/>
      <stop offset="100%" style="stop-color:#611f69"/>
    </linearGradient>
    <linearGradient id="noteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2BAC76"/>
      <stop offset="100%" style="stop-color:#36C5F0"/>
    </linearGradient>
  </defs>

  <!-- Main background -->
  <rect width="100" height="100" rx="22" fill="url(#bgGrad)"/>

  <!-- Chat bubble shape -->
  <path d="M20 25 h55 a10 10 0 0 1 10 10 v30 a10 10 0 0 1 -10 10 h-35 l-12 12 v-12 h-8 a10 10 0 0 1 -10 -10 v-30 a10 10 0 0 1 10 -10z"
        fill="white"
        opacity="0.95"/>

  <!-- Music note inside bubble -->
  <g transform="translate(38, 32)">
    <!-- Note head 1 -->
    <ellipse cx="6" cy="28" rx="7" ry="5" fill="url(#noteGrad)" transform="rotate(-20, 6, 28)"/>
    <!-- Note head 2 -->
    <ellipse cx="26" cy="23" rx="7" ry="5" fill="url(#noteGrad)" transform="rotate(-20, 26, 23)"/>
    <!-- Stems -->
    <rect x="11" y="5" width="3" height="25" fill="url(#noteGrad)"/>
    <rect x="31" y="0" width="3" height="25" fill="url(#noteGrad)"/>
    <!-- Connecting beam -->
    <polygon points="11,5 14,5 34,0 34,4 14,9 11,9" fill="url(#noteGrad)"/>
    <polygon points="11,11 14,11 34,6 34,10 14,15 11,15" fill="url(#noteGrad)"/>
  </g>
</svg>
