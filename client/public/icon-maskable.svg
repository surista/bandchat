<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5B2D5E"/>
      <stop offset="50%" style="stop-color:#4A154B"/>
      <stop offset="100%" style="stop-color:#3A0E3C"/>
    </linearGradient>
    <linearGradient id="noteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2BAC76"/>
      <stop offset="100%" style="stop-color:#36C5F0"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Edge-to-edge background (no rounded corners - OS applies mask) -->
  <rect width="100" height="100" fill="url(#bgGrad)"/>

  <!-- Chat bubble (sized within 80% safe zone) -->
  <path d="M22 27 h50 a8 8 0 0 1 8 8 v24 a8 8 0 0 1 -8 8 h-30 l-10 10 v-10 h-10 a8 8 0 0 1 -8 -8 v-24 a8 8 0 0 1 8 -8z"
        fill="white" opacity="0.95" filter="url(#shadow)"/>

  <!-- Music notes (centered in safe zone) -->
  <g transform="translate(36, 33) scale(0.88)">
    <!-- Note head 1 -->
    <ellipse cx="7" cy="27" rx="7.5" ry="5.5" fill="url(#noteGrad)" transform="rotate(-20, 7, 27)"/>
    <!-- Note head 2 -->
    <ellipse cx="29" cy="21" rx="7.5" ry="5.5" fill="url(#noteGrad)" transform="rotate(-20, 29, 21)"/>
    <!-- Stems -->
    <rect x="13" y="3" width="3" height="26" rx="1.5" fill="url(#noteGrad)"/>
    <rect x="34.5" y="-3" width="3" height="26" rx="1.5" fill="url(#noteGrad)"/>
    <!-- Beams -->
    <polygon points="13,3 16,3 37.5,-3 37.5,1 16,7 13,7" fill="url(#noteGrad)"/>
    <polygon points="13,10 16,10 37.5,4 37.5,8 16,14 13,14" fill="url(#noteGrad)"/>
  </g>
</svg>
